parse_config:
  file_folder: ./data
  clean_metadata: True

chunk_config: 
  chunk_size: 1000
  chunk_overlap: 200

embed_config:
  local_model_path: ./artifacts/models
  embedding_model_ckpt: all-MiniLM-L6-v2
  vector_dim: 384

retrieve_config:
  top_k: 5
  threshold_score: 0.3

generate_config:
  system_prompt: |
    You are a helpful assistant answering questions from company documents. 
    Rules:
    - Answer ONLY using the context provided below
    - Every claim must cite its source as (filename, page N)
    - If the answer isn't in the context, say so explicitly
    - Never make up information
  model_ckpt: Qwen/Qwen2.5-0.5B-Instruct
  temperature: 0.7
  max_new_tokens: 512